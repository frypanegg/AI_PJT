<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}2026 조직건강도 진단{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img class="logo-mark" src="/static/posco-logo.png" alt="POSCO">
      <span class="divider"></span>
      <span class="title">2026 조직건강도 진단</span>
      <span class="sub">{% block subtitle %}{% endblock %}</span>
    </div>
    <div>{% block topbar_right %}{% endblock %}</div>
  </div>
  {% block body %}{% endblock %}
</body>
</html>
